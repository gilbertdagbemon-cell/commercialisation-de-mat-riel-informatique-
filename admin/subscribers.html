<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="../ordimarket-logo.png">

    <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abonnés — Back-office OrdiMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-side" style="display:flex;flex-direction:column;">
    <div class="brand"><img src="../ordimarket-logo.png" alt="OrdiMarket"></div>
    <nav class="admin-nav">
      <a href="dashboard.html"><i class='bx bx-laptop'></i> Produits</a>
      <a href="testimonials.html"><i class='bx bx-message-square-dots'></i> Témoignages</a>
      <a href="profile.html"><i class='bx bx-user-circle'></i> Mon profil</a>
      <a href="subscribers.html" class="active"><i class='bx bx-envelope'></i> Abonnés newsletter</a>
      <a href="reviews.html"><i class='bx bx-star'></i> Avis clients</a>
    </nav>
    <div class="signout">
      <a href="#" id="signout-link" style="display:flex;align-items:center;gap:8px;font-size:13.5px;"><i class='bx bx-log-out'></i> Déconnexion</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Abonnés newsletter</h1>
      <span class="who" id="count"></span>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Email</th><th>Inscrit le</th><th>Statut</th><th>Action</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" style="text-align:center;color:var(--ink-400);padding:30px;">Chargement…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
import { requireAdmin, supabase, deactivateSubscriber } from './supabase-client.js';
import { escapeHtml, showToast, bindSignOut } from './admin-shared.js';

let currentAdmin = null;

async function load() {
  const rows = document.getElementById('rows');
  const { data, error } = await supabase.from('subscribers').select('id,email,created_at,is_active').order('created_at', { ascending: false });
  if (error) { rows.innerHTML = `<tr><td colspan="4">Erreur de chargement : ${escapeHtml(error.message)}</td></tr>`; return; }
  document.getElementById('count').textContent = `${data.length} abonné(s)`;
  if (!data.length) { rows.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--ink-400);padding:30px;">Aucun abonné pour l'instant.</td></tr>`; return; }
  rows.innerHTML = data.map(s => `
    <tr>
      <td data-label="Email">${escapeHtml(s.email)}</td>
      <td data-label="Inscrit le">${new Date(s.created_at).toLocaleDateString('fr-FR')}</td>
      <td data-label="Statut">${s.is_active ? '<span class="badge ok">Actif</span>' : '<span class="badge off">Désabonné</span>'}</td>
      <td data-label="Action">${currentAdmin?.role === 'super_admin' && s.is_active ? `<button type="button" class="btn btn-danger btn-sm" data-unsubscribe="${s.id}">Désabonner</button>` : '<span style="color:var(--ink-400);font-size:12px;">—</span>'}</td>
    </tr>`).join('');
  rows.querySelectorAll('[data-unsubscribe]').forEach(button => button.addEventListener('click', async () => {
    const id = button.dataset.unsubscribe;
    const subscriber = data.find(item => item.id === id);
    if (!subscriber || currentAdmin?.role !== 'super_admin') { showToast('Action réservée au super administrateur.', true); return; }
    if (!window.confirm(`Désabonner ${subscriber.email} de la newsletter ?`)) return;
    button.disabled = true;
    try {
      await deactivateSubscriber(id, currentAdmin);
      showToast('Abonné désabonné avec succès.');
      await load();
    } catch (e) { button.disabled = false; showToast(e.message || 'Impossible de désabonner cet abonné.', true); }
  }));
}

async function init() {
  currentAdmin = await requireAdmin();
  if (!currentAdmin) return;
  bindSignOut();
  await load();
}
init();
</script>
  <script type="module" src="admin-nav.js"></script>
</body>
</html>
