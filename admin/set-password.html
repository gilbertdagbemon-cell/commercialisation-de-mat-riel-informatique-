<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Définir votre mot de passe — OrdiMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:var(--admin-bg,#f5f7fb);padding:24px}.password-card{width:min(520px,100%);background:var(--admin-card,#fff);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:32px;box-shadow:0 18px 45px rgba(15,23,42,.10)}.password-card h1{margin:0 0 8px}.password-card p{margin:0 0 22px;line-height:1.6}.password-card label{display:block;font-weight:600;margin:14px 0 7px}.password-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d6dbe5;border-radius:10px;background:transparent;color:inherit}.password-card button{width:100%;margin-top:20px}.status{padding:12px 14px;border-radius:10px;margin-bottom:16px;display:none}.status.show{display:block}.status.error{background:#fee2e2;color:#991b1b}.status.success{background:#dcfce7;color:#166534}.hint{font-size:13px;opacity:.75}.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}.brand-mark img{width:46px;height:46px;object-fit:contain;border-radius:10px}
body.dark-theme{background:#0b1220}.dark-theme .password-card{background:#111827;border-color:#263244}.dark-theme .password-card input{border-color:#334155;color:#f8fafc;background:#0f172a}.dark-theme .hint{color:#cbd5e1}
</style>
</head>
<body>
<main class="password-card">
<div class="brand-mark"><img src="../ordimarket-logo.png" alt="OrdiMarket"><strong>OrdiMarket</strong></div>
<h1>Définir votre mot de passe</h1>
<p>Bienvenue dans l’équipe OrdiMarket. Choisissez maintenant votre mot de passe personnel et sécurisé.</p>
<div id="status" class="status" role="alert"></div>
<form id="password-form" hidden>
<label for="password">Nouveau mot de passe</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="password-confirm">Confirmer le mot de passe</label>
<input id="password-confirm" type="password" minlength="8" autocomplete="new-password" required>
<p class="hint">Utilisez au moins 8 caractères. Ne communiquez jamais votre mot de passe.</p>
<button class="btn btn-primary" id="save-password" type="submit"><i class="bx bx-lock-alt"></i> Enregistrer mon mot de passe</button>
</form>
</main>
<script type="module">
import { supabase } from './supabase-client.js';
const form=document.getElementById('password-form'); const status=document.getElementById('status'); const save=document.getElementById('save-password');
function message(text,type='error'){status.textContent=text;status.className=`status show ${type}`;}
async function init(){
  const {data,error}=await supabase.auth.getSession();
  if(error || !data.session){message('Le lien d’invitation est invalide, expiré ou a déjà été utilisé. Demandez au super administrateur de renvoyer une invitation.');return;}
  form.hidden=false;
}
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value;const c=document.getElementById('password-confirm').value;if(p.length<8){message('Le mot de passe doit contenir au moins 8 caractères.');return;}if(p!==c){message('Les deux mots de passe ne correspondent pas.');return;}save.disabled=true;try{const {error}=await supabase.auth.updateUser({password:p});if(error)throw error;message('Mot de passe enregistré. Vous pouvez maintenant vous connecter au back-office.','success');form.reset();setTimeout(async()=>{await supabase.auth.signOut();window.location.replace('login.html');},1800);}catch(err){message(err?.message||'Impossible de définir le mot de passe.');}finally{save.disabled=false;}});
init();
</script>
</body></html>
